name: 3D contribution calendar

on:
  schedule:
    # 18:30 UTC = midnight IST, daily
    - cron: "30 18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to an immutable commit SHA, not the mutable 0.7.1 tag: this is
      # third-party code running in the repo with contents:write, and a tag can
      # be re-pointed by its author at any time. SHA below == tag 0.7.1.
      - uses: yoshi389111/github-profile-3d-contrib@fd54cf20784ed9a86dc7be48bb5eb1f74e92b4f8 # 0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_DAYS: 365
          SETTING_JSON: ""

      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution calendar"
          git push
